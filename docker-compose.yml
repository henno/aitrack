services:
  aitrack:
    build: .
    image: aitrack-server
    container_name: aitrack-server
    restart: unless-stopped
    network_mode: host
    command: ["python", "/app/aitrack.py", "serve", "--host", "127.0.0.1", "--port", "3103", "--db", "/data/server.db"]
    environment:
      AITRACK_CONFIG_DIR: /data
      PYTHONUNBUFFERED: "1"
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-0}
    volumes:
      - aitrack-data:/data

volumes:
  aitrack-data:
