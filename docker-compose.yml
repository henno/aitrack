services:
  aitrack:
    build: .
    image: aitrack-server
    container_name: aitrack-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:8765"
    environment:
      AITRACK_CONFIG_DIR: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      - aitrack-data:/data

volumes:
  aitrack-data:
